<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>bs-markdown-editor Demo</title>
    <link href="../vendor/twbs/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/twbs/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --demo-bg-a: #f7efe4;
            --demo-bg-b: #dce8ff;
            --demo-orb-a: rgba(255, 248, 236, 0.95);
            --demo-orb-b: rgba(229, 239, 255, 0.9);
            --demo-ink: var(--bs-body-color);
            --demo-muted: var(--bs-secondary-color);
            --demo-panel: rgba(255, 255, 255, 0.84);
            --demo-panel-border: rgba(148, 163, 184, 0.35);
            --demo-preview-bg: rgba(255, 255, 255, 0.7);
            --demo-preview-border: rgba(148, 163, 184, 0.3);
            --demo-code-bg: #111827;
            --demo-code-fg: #e5e7eb;
            --demo-log-bg: #0f172a;
            --demo-log-fg: #e2e8f0;
            --demo-shadow: 0 12px 34px rgba(15, 23, 42, 0.08);
        }
        [data-bs-theme="dark"] {
            --demo-bg-a: #0f172a;
            --demo-bg-b: #132238;
            --demo-orb-a: rgba(56, 189, 248, 0.16);
            --demo-orb-b: rgba(251, 191, 36, 0.12);
            --demo-ink: var(--bs-body-color);
            --demo-muted: rgba(226, 232, 240, 0.78);
            --demo-panel: rgba(15, 23, 42, 0.72);
            --demo-panel-border: rgba(148, 163, 184, 0.22);
            --demo-preview-bg: rgba(15, 23, 42, 0.58);
            --demo-preview-border: rgba(148, 163, 184, 0.2);
            --demo-code-bg: rgba(2, 6, 23, 0.92);
            --demo-code-fg: #dbeafe;
            --demo-log-bg: rgba(2, 6, 23, 0.92);
            --demo-log-fg: #dbeafe;
            --demo-shadow: 0 18px 40px rgba(2, 6, 23, 0.36);
        }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--demo-ink);
            font-family: "Space Grotesk", "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
            background: radial-gradient(circle at 10% 20%, var(--demo-orb-a) 0%, transparent 40%),
                        radial-gradient(circle at 90% 10%, var(--demo-orb-b) 0%, transparent 35%),
                        linear-gradient(160deg, var(--demo-bg-a), var(--demo-bg-b));
        }
        .demo-shell {
            max-width: 1500px;
            margin: 0 auto;
            padding: 2rem 1rem 2.5rem;
        }
        .hero, .panel {
            border: 1px solid var(--demo-panel-border);
            background: var(--demo-panel);
            backdrop-filter: blur(8px);
            border-radius: 1rem;
            box-shadow: var(--demo-shadow);
        }
        .hero {
            padding: 1rem 1.25rem;
        }
        .hero h1 {
            margin: 0;
            font-size: clamp(1.3rem, 2vw, 2rem);
        }
        .hero p {
            margin: 0.35rem 0 0;
            color: var(--demo-muted);
        }
        .panel-header {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid var(--demo-preview-border);
        }
        .panel-body {
            padding: 1rem;
        }
        .stat-pill {
            border: 1px solid var(--demo-panel-border);
            border-radius: 999px;
            padding: 0.2rem 0.6rem;
            font-size: 0.75rem;
            color: var(--demo-muted);
            background: color-mix(in srgb, var(--demo-panel) 92%, transparent);
        }
        .controls .btn {
            border-radius: 999px;
        }
        .hero-actions .btn {
            border-radius: 999px;
        }
        #livePreview {
            min-height: 460px;
            max-height: 72vh;
            overflow: auto;
            background: var(--demo-preview-bg);
            border: 1px solid var(--demo-preview-border);
            border-radius: 0.75rem;
            padding: 1rem;
        }
        #livePreview pre {
            background: var(--demo-code-bg);
            color: var(--demo-code-fg);
            padding: 0.8rem;
            border-radius: 0.5rem;
            overflow-x: auto;
        }
        #eventLog {
            height: 260px;
            overflow: auto;
            border-radius: 0.75rem;
            background: var(--demo-log-bg);
            color: var(--demo-log-fg);
            font-family: "JetBrains Mono", "Fira Code", "Consolas", monospace;
            font-size: 12px;
            padding: 0.55rem 0.7rem;
        }
        .log-line + .log-line {
            margin-top: 0.2rem;
        }
    </style>
</head>
<body>
<main class="demo-shell">
    <section class="hero mb-4">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3">
            <div>
                <h1>bs-markdown-editor Demo Playground</h1>
                <p>Live preview updates over plugin events and uses <code>$.bsMarkdownEditor.toHtml()</code>.</p>
            </div>
        </div>
    </section>

    <div class="row g-4">
        <div class="col-12 col-xl-7">
            <section class="panel h-100">
                <div class="panel-header d-flex flex-wrap justify-content-between align-items-center gap-2">
                    <strong><i class="bi bi-pencil-square me-1"></i>Editor</strong>
                    <span class="stat-pill" id="modeBadge"><i class="bi bi-dot me-1"></i>Mode: editor</span>
                </div>
                <div class="panel-body">
                    <div class="controls mb-3 d-flex flex-wrap gap-2">
                        <button id="modeGet" class="btn btn-sm btn-outline-secondary">Get Mode</button>
                        <button id="valGet" class="btn btn-sm btn-outline-secondary">Get Value</button>
<!--                        <button id="valSet" class="btn btn-sm btn-outline-secondary">Set Sample</button>-->
                        <button id="loadExample" class="btn btn-sm btn-outline-primary">Load example.md</button>
<!--                        <button id="valAppend" class="btn btn-sm btn-outline-secondary">Append Timestamp</button>-->
                    </div>
                    <textarea id="editor" class="form-control"></textarea>
                </div>
            </section>
        </div>

        <div class="col-12 col-xl-5">
            <section class="panel mb-4">
                <div class="panel-header d-flex justify-content-between align-items-center">
                    <strong><i class="bi bi-eye me-1"></i>Live Preview</strong>
                    <span class="stat-pill">Event-driven</span>
                </div>
                <div class="panel-body">
                    <div id="livePreview"></div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-header d-flex justify-content-between align-items-center">
                    <strong><i class="bi bi-broadcast me-1"></i>Event Log</strong>
                    <button id="clearLog" class="btn btn-sm btn-outline-danger">Clear</button>
                </div>
                <div class="panel-body">
                    <div id="eventLog"></div>
                </div>
            </section>
        </div>
    </div>
</main>

<script src="../vendor/components/jquery/jquery.min.js"></script>
<script src="../vendor/twbs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<!--<script src="../dist/locale/de-DE.js"></script>-->
<script src="../dist/bs-markdown-editor.js"></script>
<script src="https://cdn.jsdelivr.net/gh/ThomasDev-de/bs-emoji-picker@2.0.2/dist/bs-emoji-picker.min.js"></script>
<script>
    const $editor = $('#editor');
    const $eventLog = $('#eventLog');
    const $modeBadge = $('#modeBadge');
    const $livePreview = $('#livePreview');
    const $root = $(document.documentElement);

    function addLog(label, payload) {
        const now = new Date().toLocaleTimeString();
        const line = $('<div class="log-line"></div>');
        const pretty = payload ? JSON.stringify(payload) : '';
        line.text(`[${now}] ${label}${pretty ? ' -> ' + pretty : ''}`);
        $eventLog.prepend(line);
    }

    function updateMeta() {
        const mode = $editor.bsMarkdownEditor('mode');
        $modeBadge.html(`<i class="bi bi-dot me-1"></i>Mode: ${mode}`);
    }


    function updateLivePreview(value) {
        const text = String(value || '');
        if (text.trim() === '') {
            $livePreview.html('<div class="text-body-secondary">Start typing to see live preview.</div>');
            return;
        }
        $livePreview.html($.bsMarkdownEditor.toHtml(text));
    }

    $editor.bsMarkdownEditor({
        lang: 'en',
        modes: ['editor', 'html', 'preview'],
        resize: 'both',
        showStats: true,
        btnClass: 'border-0',
        customActions: {
            emoji: {
                position: 'left',
                render(context) {
                    const $picker = $('<div class="btn-group"></div>');
                    let lastSelection = {
                        start: context.textarea.selectionStart || 0,
                        end: context.textarea.selectionEnd || 0
                    };

                    function captureEditorSelection() {
                        const selection = window.getSelection();
                        if (!selection || selection.rangeCount === 0) {
                            return;
                        }
                        const range = selection.getRangeAt(0);
                        if (!context.editable.contains(range.startContainer) || !context.editable.contains(range.endContainer)) {
                            return;
                        }
                        const offsets = context.helpers.getEditableSelectionOffsets(context.editable);
                        lastSelection = {
                            start: offsets.start,
                            end: offsets.end
                        };
                        context.textarea.setSelectionRange(lastSelection.start, lastSelection.end);
                    }

                    function rememberSelection() {
                        captureEditorSelection();
                        $picker.data('bsMarkdownEditorEmojiSelection', lastSelection);
                    }

                    context.$editable.on('keyup.bsMarkdownEditorEmoji mouseup.bsMarkdownEditorEmoji touchend.bsMarkdownEditorEmoji input.bsMarkdownEditorEmoji', captureEditorSelection);
                    $(document).on('selectionchange.bsMarkdownEditorEmoji', captureEditorSelection);
                    captureEditorSelection();

                    $picker.bsEmojiPicker({
                        btnClass: context.navButtonClass || context.buttonClassBase,
                        btnText: '<i class="bi bi-emoji-smile"></i>',
                        targetInput: null,
                        onClickEmoji(emoji) {
                            const selection = $picker.data('bsMarkdownEditorEmojiSelection') || lastSelection || {
                                start: context.textarea.selectionStart,
                                end: context.textarea.selectionEnd
                            };
                            context.textarea.setSelectionRange(selection.start, selection.end);
                            context.helpers.replaceSelection(
                                context.textarea,
                                emoji,
                                emoji.length,
                                emoji.length,
                                'customAction'
                            );
                            addLog('customAction.emoji', {emoji});
                        }
                    });

                    $picker.find('[data-bs-toggle="dropdown"]').attr({title: 'Emoji', 'aria-label': 'Emoji'});
                    $picker.find('.dropdown-menu').addClass('dropdown-menu-end');
                    $picker.on('mousedown', '[data-bs-toggle="dropdown"]', rememberSelection);
                    $picker.on('show.bs.dropdown', '.dropdown-emoji', rememberSelection);

                    return $picker;
                }
            }
        },
    });


    $editor.on('ready.bs.markdown-editor', function (event, data) {
        const value = $editor.bsMarkdownEditor('val') || '';
        updateMeta();
        updateLivePreview(value);
        addLog(event.type, data);
    });

    $editor.on('change.bs.markdown-editor', function (event, data) {
        const value = data && typeof data.value === 'string' ? data.value : $editor.bsMarkdownEditor('val');
        updateMeta();
        updateLivePreview(value);
        addLog(event.type, data);
    });

    $editor.on('userChange.bs.markdown-editor', function (event, data) {
        addLog(event.type, data);
    });

    $editor.on('modeChange.bs.markdown-editor', function (event, data) {
        updateMeta();
        addLog(event.type, data);
    });

    $editor.on('any.bs.markdown-editor', function (event, data) {
        addLog('any.bs.markdown-editor', data);
    });

    $('#modeGet').on('click', function () {
        addLog('method.mode()', {mode: $editor.bsMarkdownEditor('mode')});
    });
    $('#valGet').on('click', function () {
        addLog('method.val()', {value: $editor.bsMarkdownEditor('val')});
    });
    // $('#valSet').on('click', function () {
    //     $editor.bsMarkdownEditor('val', '# Demo Heading\n\nA little **bold** text with `inline code`.\n\n```php\n/**\n * Noch en Testkommentar\n * @param string $test\n */\nfunction test(\n    string $test = "",\n    int $test2 = 3,\n    DB $pdo\n) {\n    // Test Ausgabe\n    echo "test $test";\n<<<ROFL\nHallo $test\nROFL;\n}\n```\n\n![Placeholder image](https://placehold.co/320x180){width=320 height=180}\n\n- item 1\n- item 2\n\nx<sup>2</sup> and H<sub>2</sub>O');
    // });
    $('#loadExample').on('click', async function () {
        const $button = $(this);
        const originalText = $button.text();
        $button.prop('disabled', true).text('Loading...');
        try {
            const response = await fetch('../example.md', {cache: 'no-cache'});
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            const markdown = await response.text();
            $editor.bsMarkdownEditor('val', markdown);
            $editor.bsMarkdownEditor('mode', 'editor');
            addLog('demo.loadExample', {source: '../example.md', chars: markdown.length});
        } catch (error) {
            addLog('demo.loadExample.error', {message: error.message});
        } finally {
            $button.prop('disabled', false).text(originalText);
        }
    });
    // $('#valAppend').on('click', function () {
    //     const value = $editor.bsMarkdownEditor('val');
    //     $editor.bsMarkdownEditor('val', value + '\n\nUpdated at: ' + new Date().toISOString());
    // });
    $('#clearLog').on('click', function () {
        $eventLog.empty();
    });

</script>
</body>
</html>
